<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page - Music Theorydiver</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <div class="logo"><a href="index.html">Music Theorydiver</a></div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="chordvault.html">Chord Vault</a></li>
        <li><a href="practicepage.html">Practice</a></li>
        <li><a href="piano.html">Virtual Piano</a></li>
        <li><a href="contact.html" class="active">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <div class="contact-layout">
        <div class="contact-info">
            <div>
                <h2 class="page-title">Contact Us</h2>
                <p class="contact-desc">Have any concerns or suggestions? Ring us up and we’ll help you get back to making great tunes!</p>
            </div>

            <div class="contact-item">
                <img src="img/vecteezy_messages-mail-icons-mail-notifications-transparent_23431013.png" alt="mail logo" class="contact-logo">
                <a href="mailto:admin@MTheorydiver.org">admin@MTheorydiver.org</a>
            </div>
            <div class="contact-item">
                <img src="img/vecteezy_facebook-logo-white-circle-outline-icon-fb-app-transparent_65386565.png" alt="facebook logo" class="contact-logo">
                <a href="https://www.facebook.com/MTheorydiver" target="_blank">facebook.com/MTheorydiver</a>
            </div>
            <div class="contact-item">
                <img src="img/vecteezy_instagram-letter-white-logo-icon-ig-app-transparent_65386519.png" alt="instagram logo" class="contact-logo">
                <a href="https://www.instagram.com/MTheorydiver" target="_blank">instagram.com/MTheorydiver</a>
            </div>
        </div>

        <div class="form">
            <h3 class="form-desc">Send us a message</h3>
            <form action="#">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" placeholder="Mama Ru Nong" required>
                </div>
                <div class="form-group">
                    <label for="email">Your Email</label>
                    <input type="email" id="email" name="email" placeholder="nongmamaru@example.com" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Write your thoughts or suggestions here..." required></textarea>
                </div>
                <button type="submit" class="orange-button submit">Send Message</button>
            </form>
        </div>
    </div>
  </main>
</body>
</html>
