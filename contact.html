<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page - Music Theorydiver</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .contact-layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4rem;
        }

        .contact-info {
        display: flex;
        flex-direction: column;
        gap: 2rem;
        }

        .contact-item {
        display: flex;
        align-items: center;
        gap: 1.5rem;
        font-size: 1.2rem;
        }

        .contact-logo {
        width: 5%;
        }

        .contact-item a {
        color: #fff;
        text-decoration: none;
        }

        .contact-item a:hover {
        text-decoration: underline;
        }

        form {
        background: rgba(255, 255, 255, 0.03);
        padding: 2.5rem;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .form-group {
        margin-bottom: 1.5rem;
        }

        .form-desc {
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }

        .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 500;
        }

        .form-group input, .form-group textarea {
        width: 100%;
        padding: 0.8rem 1rem;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 6px;
        color: white;
        font-size: 1rem;
        }

        .form-group textarea {
        resize: vertical;
        height: 120px;
        }

        .submit {
            width: 100%;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
  <header>
    <div class="logo"><a href="index.html">Music Theorydiver</a></div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="chordvault.html">Chord Vault</a></li>
        <li><a href="practicepage.html">Practice</a></li>
        <li><a href="piano.html">Virtual Piano</a></li>
        <li><a href="contact.html" class="active">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <div class="contact-layout">
        <div class="contact-info">
            <div>
                <h2 class="page-title">Contact Us</h2>
                <p class="section-desc">Have any concerns or suggestions? Ring us up and we’ll help you get back to making great tunes!</p>
            </div>

            <div class="contact-item">
                <img src="img/vecteezy_messages-mail-icons-mail-notifications-transparent_23431013.png" alt="mail logo" class="contact-logo">
                <a href="mailto:admin@MTheorydiver.org">admin@MTheorydiver.org</a>
            </div>
            <div class="contact-item">
                <img src="img/vecteezy_facebook-logo-white-circle-outline-icon-fb-app-transparent_65386565.png" alt="facebook logo" class="contact-logo">
                <a href="https://www.facebook.com/MTheorydiver" target="_blank">facebook.com/MTheorydiver</a>
            </div>
            <div class="contact-item">
                <img src="img/vecteezy_instagram-letter-white-logo-icon-ig-app-transparent_65386519.png" alt="instagram logo" class="contact-logo">
                <a href="https://www.instagram.com/MTheorydiver" target="_blank">instagram.com/MTheorydiver</a>
            </div>
        </div>

        <div class="form">
            <h3 class="form-desc">Send us a message</h3>
            <form action="#">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" placeholder="Mama Ru Nong" required>
                </div>
                <div class="form-group">
                    <label for="email">Your Email</label>
                    <input type="email" id="email" name="email" placeholder="nongmamaru@example.com" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Write your thoughts or suggestions here..." required></textarea>
                </div>
                <button type="submit" class="orange-button submit">Send Message</button>
            </form>
        </div>
    </div>
  </main>
</body>
</html>
